<script>
// Trava ANTES de renderizar: a porta de entrada é a sessão do ERP (mesmo padrão
// de planilha.html e ponto.html). Sem sessão válida, manda pro login (index.html).
(function () {
  try {
    var raw = localStorage.getItem('sg_auth_session');
    var s = raw ? JSON.parse(raw) : null;
    if (s && s.idVendedor && s.expiresAt && Date.now() < s.expiresAt) { window.SG_SESSION = s; return; }
  } catch (e) {}
  document.documentElement.classList.add('sg-locked');
  window.location.replace('index.html');
})();
</script>
</head>

<div class="app">
